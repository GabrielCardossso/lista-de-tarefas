<text x="68" y="410" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">O botão<tspan font-weight="700" fill="#ece9e4"> sol/lua</tspan> vira com animação e troca o tema da</text>
<text x="68" y="432" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">página.</text>
</g>
