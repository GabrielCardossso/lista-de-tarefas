<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Funcionalidades de lista-de-tarefas</title>
<desc id="desc">Adicionar tarefas: Digite e clique em Adicionar ou aperte Enter; textos vazios são ignorados. · Marcar como concluída: Um clique no texto da tarefa alterna entre pendente e concluída. · Remover com animação: O botão Excluir risca a tarefa e a faz cair antes de sair da lista. · Salvas no navegador: As tarefas ficam no localStorage e continuam lá ao recarregar a página. · Tema claro e escuro: O botão sol/lua vira com animação e troca o tema da página. · Sem instalação: Nenhuma dependência nem build: basta abrir o tarefas.html no navegador.</desc>
<style>
.mono{font-family:'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'DejaVu Sans Mono', 'Courier New', monospace}
text{shape-rendering:auto}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" opacity=".06"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern>
<clipPath id="card"><rect width="1200" height="490" rx="10"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="490" fill="#191817"/>
<rect width="1200" height="490" fill="url(#grid)"/>
<rect width="1200" height="40" fill="#262422"/>
<rect y="40" width="1200" height="1" fill="#3a3733"/>
<rect x="20" y="14" width="12" height="12" fill="#e5534b"/>
<rect x="40" y="14" width="12" height="12" fill="#e0a43b"/>
<rect x="60" y="14" width="12" height="12" fill="#5fb85f"/>
<text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#86817a">funcionalidades.md</text>
<rect x="48" y="78" width="10" height="10" fill="#d97757"/>
<text x="70" y="88" class="mono" font-size="18" font-weight="700" fill="#ece9e4">Funcionalidades</text>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.952;1" dur="0.2s" fill="freeze"/>
<rect x="48.5" y="116.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="68" y="138" width="8" height="8" fill="#d97757"/>
<text x="86" y="147" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Adicionar tarefas</text>
<text x="68" y="174" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Digite e clique em<tspan font-weight="700" fill="#ece9e4"> Adicionar</tspan> ou aperte<tspan font-weight="700" fill="#ece9e4"> Enter</tspan>; textos</text>
<text x="68" y="196" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">vazios são ignorados.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.968;1" dur="0.3s" fill="freeze"/>
<rect x="624.5" y="116.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="138" width="8" height="8" fill="#d97757"/>
<text x="662" y="147" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Marcar como concluída</text>
<text x="644" y="174" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Um clique no texto da tarefa alterna entre<tspan font-weight="700" fill="#ece9e4"> pendente</tspan> e</text>
<text x="644" y="196" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve"><tspan font-weight="700" fill="#ece9e4">concluída</tspan>.</text>
</g>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.976;1" dur="0.4s" fill="freeze"/>
<rect x="48.5" y="234.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="68" y="256" width="8" height="8" fill="#d97757"/>
<text x="86" y="265" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Remover com animação</text>
<text x="68" y="292" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">O botão<tspan font-weight="700" fill="#ece9e4"> Excluir</tspan> risca a tarefa e a faz cair antes de sair</text>
<text x="68" y="314" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">da lista.</text>
