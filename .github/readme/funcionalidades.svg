<rect x="624.5" y="352.5" width="528" height="102" rx="6" fill="#121110" stroke="#3a3733"/>
<rect x="644" y="374" width="8" height="8" fill="#d97757"/>
<text x="662" y="383" class="mono" font-size="16" font-weight="700" fill="#ece9e4">Sem instalação</text>
<text x="644" y="410" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">Nenhuma dependência nem build: basta abrir o<tspan font-weight="700" fill="#ece9e4"> tarefas.html</tspan></text>
<text x="644" y="432" class="mono" font-size="14" fill="#b7b2aa" xml:space="preserve">no navegador.</text>
